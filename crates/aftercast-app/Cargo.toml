[package]
name = "aftercast-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
default-run = "aftercast"

[[bin]]
name = "aftercast"
path = "src/main.rs"

[dependencies]
aftercast = { path = "../aftercast" }
arboard = { version = "3", default-features = false }
camino.workspace = true
chorale-core = "0.2.3"
chorale-dioxus = { path = "../../vendor/chorale-dioxus" }
dioxus = { version = "=0.7.10", default-features = false, features = ["desktop", "launch", "lib"] }
dioxus-charts = "0.4"
dioxus-i18n = "=0.6.0"
dioxus-sdk = { version = "=0.7.0", features = ["time"] }
directories = "6"
flate2 = "1"
icons = { version = "0.19", features = ["dioxus"] }
jiff = "0.2"
miette = { version = "7", features = ["fancy"] }
open = "5"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
toml_edit = { version = "0.25", features = ["serde"] }
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tw_merge = "0.1"
usage-rs = "7"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
rstest.workspace = true
sha2 = "0.10"
ureq = "3"
usage-rs = { version = "7", features = ["test"] }

[build-dependencies]
miette = "7"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
toml_edit = { version = "0.25", features = ["serde"] }
ureq = "3"

[lints]
workspace = true

[package]
name = "aftercast-winforms"
version.workspace = true
edition.workspace = true
description = "A prebuilt managed WinForms compatibility assembly for Linux hosts"
include = [
  "README.md",
  "managed/*.cs",
  "managed/*.csproj",
  "managed/*.dll",
  "managed/Charting/*.cs",
  "managed/Charting/*.csproj",
  "managed/Charting/packages.lock.json",
  "managed/packages.lock.json",
  "managed/tests/*.cs",
  "managed/tests/*.csproj",
  "managed/tests/packages.lock.json",
  "src/**",
]
publish.workspace = true

[lints]
workspace = true

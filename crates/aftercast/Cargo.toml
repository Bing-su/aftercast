[package]
name = "aftercast"
version.workspace = true
edition.workspace = true
description = "An in-process ACT-compatible host for Rust applications"
include = [
  "README.md",
  "examples/**",
  "managed/*.LICENSE",
  "managed/*.dll",
  "managed/*.json",
  "src/**",
  "tests/**",
]
publish.workspace = true

[dependencies]
aftercast-tts = { workspace = true, default-features = false }
bon.workspace = true
bytes.workspace = true
camino.workspace = true
netcorehost.workspace = true
scopeguard.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
rstest.workspace = true
tempfile = "3"

[dev-dependencies.tokio]
version = "1"
features = ["macros", "rt", "time"]

[target.'cfg(target_os = "linux")'.dependencies]
aftercast-winforms.workspace = true

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Com"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Com"] }

[features]
audio = ["aftercast-tts/playback", "aftercast-tts/system"]

[lints]
workspace = true

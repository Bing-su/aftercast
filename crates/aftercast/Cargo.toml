[package]
name = "aftercast"
version.workspace = true
edition.workspace = true
description = "A process-isolated ACT-compatible host for Rust applications"
include = [
  "README.md",
  "examples/**",
  "managed/*.LICENSE",
  "managed/*.dll",
  "managed/*.json",
  "src/**",
  "tests/**",
]
publish.workspace = true

[[example]]
name = "test-application"
path = "tests/support/application.rs"

[dependencies]
aftercast-tts = { workspace = true, default-features = false }
bon.workspace = true
bytes.workspace = true
camino.workspace = true
getrandom = "0.4"
netcorehost.workspace = true
postcard = { version = "1", default-features = false, features = ["use-std"] }
scopeguard.workspace = true
serde = { version = "1", features = ["derive"] }
thiserror.workspace = true
tokio = { version = "1", features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
rstest.workspace = true
serde_json = "1"
tempfile = "3"

[dev-dependencies.tokio]
version = "1"
features = ["macros", "rt", "time"]

[target.'cfg(target_os = "linux")'.dependencies]
aftercast-winforms.workspace = true
libc = "0.2"

[target."cfg(windows)".dependencies]
dunce = "1"
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_Com", "Win32_System_JobObjects"] }

[features]
audio = ["aftercast-tts/playback", "aftercast-tts/system"]

[lints]
workspace = true

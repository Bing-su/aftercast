[package]
name = "aftercast"
description = "An in-process ACT-compatible host for Rust applications"
version.workspace = true
edition.workspace = true
publish.workspace = true
include = [
  "src/**",
  "examples/**",
  "tests/**",
  "managed/*.dll",
  "managed/*.json",
  "managed/*.LICENSE",
  "README.md",
]

[dependencies]
bon.workspace = true
bytes.workspace = true
camino.workspace = true
netcorehost.workspace = true
thiserror.workspace = true
tracing.workspace = true
scopeguard.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
aftercast-winforms.workspace = true

[lints]
workspace = true

[dev-dependencies]
rstest.workspace = true
tempfile = "3.27.0"

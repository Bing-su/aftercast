[package]
name = "aftercast-tts"
version.workspace = true
edition.workspace = true
description = "Pluggable offline and online text-to-speech for Windows and Linux"
publish.workspace = true

[dependencies]
msedge-tts = { version = "0.4", default-features = false, features = ["tokio-runtime"], optional = true }
rodio = { version = "0.23", default-features = false, features = ["flac", "mp3", "playback", "vorbis", "wav"], optional = true }
thiserror.workspace = true
tokio = { version = "1", features = ["sync"] }
url = { version = "2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
speech-dispatcher = { version = "0.16", optional = true }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Media_Speech", "Win32_System_Com"], optional = true }

[features]
default = ["edge", "system"]
edge = ["dep:msedge-tts", "playback", "tokio/macros", "tokio/net", "tokio/rt", "tokio/time"]
playback = ["dep:rodio", "dep:url"]
system = ["dep:speech-dispatcher", "dep:windows"]

[lints]
workspace = true

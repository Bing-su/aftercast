[package]
name = "aftercast-tts"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Pluggable offline and online text-to-speech for Windows and Linux"

[features]
default = ["system", "edge"]
system = ["dep:windows", "dep:speech-dispatcher"]
edge = ["dep:msedge-tts", "dep:tokio", "dep:rodio"]

[dependencies]
thiserror.workspace = true
msedge-tts = { version = "0.4.1", default-features = false, features = ["tokio-runtime"], optional = true }
tokio = { version = "1", features = ["rt", "net", "time", "macros"], optional = true }
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_Speech", "Win32_System_Com"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
speech-dispatcher = { version = "0.16", optional = true }

[lints]
workspace = true

[vars]
managed_tests = "dotnet run --project managed/tests/ManagedTests/ManagedTests.csproj -c Release --no-build --"
original_tests = "dotnet run --project managed/tests/OriginalReference/OriginalReference.csproj -c Release --no-build --"
act = "binaries/act/Advanced Combat Tracker.exe"
forms = "crates/aftercast-winforms/managed"
reference_probe = "managed/tests/LegacyReference/bin/Release/net10.0/Aftercast.LegacyReference.dll"

[tasks."managed:build"]
description = "Build the bridge and refresh the Cargo payload"
depends = ["winforms:build"]
run = "dotnet publish managed/Bridge/Bridge.csproj -c Release --no-self-contained -o crates/aftercast/managed -p:RestoreLockedMode=true"

[tasks."winforms:build"]
description = "Build the independent WinForms and chart payload"
run = [
  "dotnet build crates/aftercast-winforms/managed/Charting/Charting.csproj -c Release -o target/managed/forms -p:RestoreLockedMode=true",
  "cp target/managed/forms/System.Windows.Forms.dll target/managed/forms/System.Windows.Forms.DataVisualization.dll crates/aftercast-winforms/managed/",
]

[tasks."managed:restore"]
description = "Refresh managed dependency locks"
run = [
  "dotnet restore managed/Bridge/Bridge.csproj",
  "dotnet restore crates/aftercast-winforms/managed/Charting/Charting.csproj",
  "dotnet restore crates/aftercast-winforms/managed/tests/ContractTests.csproj",
  "dotnet restore managed/tests/PluginFixture/PluginFixture.csproj",
  "dotnet restore managed/tests/LegacyReference/LegacyReference.csproj",
  "dotnet restore managed/tests/OriginalReference/OriginalReference.csproj",
  "dotnet restore managed/tests/OriginalWriter/OriginalWriter.csproj",
  "dotnet restore managed/tests/ManagedTests/ManagedTests.csproj",
]

[tasks.check]
description = "Run Rust, managed and CLR fixture checks (DOTNET_ROOT required)"
depends = ["managed:test", "test:winforms", "test:hosting", "test:plugins"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
]

[tasks."package:check"]
description = "Verify all offline Cargo packages"
run = [
  "cargo package -p aftercast-winforms --offline",
  "cargo package -p aftercast-tts --offline",
  "cargo package -p aftercast --offline --exclude-lockfile --config 'patch.crates-io.aftercast-winforms.path=\"target/package/aftercast-winforms-0.1.0\"' --config 'patch.crates-io.aftercast-tts.path=\"target/package/aftercast-tts-0.1.0\"'",
]
run_windows = [
  "cargo package -p aftercast-winforms --offline",
  "cargo package -p aftercast-tts --offline",
  "cargo package -p aftercast --offline --exclude-lockfile --config \"patch.crates-io.aftercast-winforms.path='target/package/aftercast-winforms-0.1.0'\" --config \"patch.crates-io.aftercast-tts.path='target/package/aftercast-tts-0.1.0'\"",
]

[tasks.smoke]
description = "Extract the bundled payload, start, probe and stop"
run = "cargo run -p aftercast --example smoke --"

[tasks."managed:test"]
description = "Check the bridge and synthetic ACT contracts"
depends = ["managed:test-runner"]
run = ["{{vars.managed_tests}} bridge", "{{vars.managed_tests}} contracts"]

[tasks."test:winforms"]
description = "Check independent WinForms and chart contracts"
depends = ["winforms:build"]
run = "dotnet run --project crates/aftercast-winforms/managed/tests/ContractTests.csproj -c Release -p:RestoreLockedMode=true"

[tasks."test:winforms-load"]
description = "Measure headless lookups, tree paths and disposal allocations"
depends = ["winforms:build"]
run = "dotnet run --project crates/aftercast-winforms/managed/tests/ContractTests.csproj -c Release -p:RestoreLockedMode=true -- load"

[tasks."test:hosting"]
description = "Check CLR lifecycle and diagnostics (DOTNET_ROOT required)"
depends = ["managed:build"]
run = "cargo test -p aftercast --lib --test hosting -- --ignored"

[tasks."test:plugins"]
description = "Check plugin lifecycle and owned output (DOTNET_ROOT required)"
depends = ["managed:test-runner"]
run = [
  "dotnet build managed/tests/PluginFixture/PluginFixture.csproj -c Release -p:RestoreLockedMode=true",
  "{{vars.managed_tests}} plugins",
  "cargo test -p aftercast --test plugins --test lifecycle --test import --test logs --test snapshots --test speech --test archives --test async_host --test process_isolation -- --ignored",
]

[tasks."test:log-load"]
description = "Measure synthetic log-buffer load and loss accounting"
depends = ["managed:test-runner"]
run = "{{vars.managed_tests}} log-load"

[tasks."test:query-load"]
description = "Measure combat query paging and encoding allocations"
depends = ["managed:test-runner"]
run = "{{vars.managed_tests}} query-load"

[tasks."test:archive-load"]
description = "Measure bounded gzip archive decompression and verification"
depends = ["managed:test-runner"]
run = "{{vars.managed_tests}} archive-load"

[tasks."test:original"]
description = "Compare reference contracts with genuine ACT"
depends = ["managed:references"]
run = [
  "{{vars.managed_tests}} act",
  '{{vars.original_tests}} "{{vars.act}}" {{vars.forms}}',
  '{{vars.original_tests}} "{{vars.act}}" {{vars.forms}} values',
  '{{vars.original_tests}} "{{vars.act}}" {{vars.forms}} actions',
  '{{vars.original_tests}} "{{vars.act}}" {{vars.forms}} contracts {{vars.reference_probe}}',
]

[tasks."test:linux-plugin-compat"]
description = "Check pinned Linux memory, writer and resource corrections"
depends = ["managed:test-runner"]
run = "{{vars.managed_tests}} linux"

[tasks."test:external-plugin"]
description = "Check a trusted external plugin's constructor, lifecycle and host diagnostics"
depends = ["managed:test-runner"]
usage = '''
arg "<plugin>" help="Trusted compiled plugin assembly"
arg "<type>" help="Fully qualified plugin type"
arg "<state>" help="Private writable test state directory"
'''
run = '{{vars.managed_tests}} external-plugin "$usage_plugin" "$usage_type" "$usage_state"'
# Preserve explicit paths/types on Windows, e.g. a plugin directory containing spaces.
run_windows = '{{vars.managed_tests}} external-plugin "%usage_plugin%" "%usage_type%" "%usage_state%"'

[tasks."test:text-exports"]
description = "Compare unaligned text exports with original ACT (Windows native reference)"
depends = ["managed:references"]
run = "{{vars.managed_tests}} text-exports"
run_windows = [
  "{{vars.managed_tests}} text-exports",
  'dotnet exec --runtimeconfig crates/aftercast/managed/Aftercast.Bridge.runtimeconfig.windows.json managed/tests/OriginalReference/bin/Release/net10.0/Aftercast.OriginalReference.dll "{{vars.act}}" {{vars.forms}} text-exports {{vars.reference_probe}}',
]

[tasks."test:parent-settings"]
description = "Check parent settings; compare with genuine ACT on Windows"
depends = ["managed:references"]
run = "{{vars.managed_tests}} parent-settings"
run_windows = [
  "{{vars.managed_tests}} parent-settings",
  'dotnet exec --runtimeconfig crates/aftercast/managed/Aftercast.Bridge.runtimeconfig.windows.json managed/tests/OriginalReference/bin/Release/net10.0/Aftercast.OriginalReference.dll "{{vars.act}}" {{vars.forms}} parent-settings {{vars.reference_probe}}',
]

[tasks."test:encounter-archives"]
description = "Compare ACT XML/gzip and history-record contracts against genuine ACT"
depends = ["managed:references"]
run = [
  "{{vars.managed_tests}} encounter-xml",
  "{{vars.managed_tests}} encounter-xml-import",
  "{{vars.managed_tests}} history-records",
  '{{vars.original_tests}} "{{vars.act}}" {{vars.forms}} encounter-xml {{vars.reference_probe}}',
  '{{vars.original_tests}} "{{vars.act}}" {{vars.forms}} encounter-xml-import {{vars.reference_probe}}',
  '{{vars.original_tests}} "{{vars.act}}" {{vars.forms}} history-records {{vars.reference_probe}}',
]

[tasks."test:selective-parsing"]
description = "Compare selected attacker/victim routing with genuine ACT"
depends = ["managed:references"]
run = [
  "{{vars.managed_tests}} selective-parsing",
  '{{vars.original_tests}} "{{vars.act}}" {{vars.forms}} selective-parsing {{vars.reference_probe}}',
]

[tasks."test:custom-trigger-models"]
description = "Compare custom trigger models and share XML with genuine ACT"
depends = ["managed:references"]
run = [
  "{{vars.managed_tests}} custom-trigger-models",
  '{{vars.original_tests}} "{{vars.act}}" {{vars.forms}} custom-trigger-models {{vars.reference_probe}}',
]

[tasks."test:data-corrections"]
description = "Compare headless rename/ability redirect rules with genuine ACT"
depends = ["managed:references"]
run = [
  "{{vars.managed_tests}} data-corrections",
  '{{vars.original_tests}} "{{vars.act}}" {{vars.forms}} data-corrections {{vars.reference_probe}}',
]

[tasks."test:external-export"]
description = "Exercise unmodified Export_All against two combat ends and restore the native clipboard"
depends = ["managed:test-runner"]
usage = '''
arg "<plugin>" help="Trusted compiled Export_All assembly"
arg "<state>" help="Private writable test state directory"
'''
run = '{{vars.managed_tests}} external-export "$usage_plugin" "$usage_state"'
run_windows = '{{vars.managed_tests}} external-export "%usage_plugin%" "%usage_state%"'

[tasks."observe:overlay-stack"]
description = "Observe original FFXIV, OverlayPlugin and cactbot startup; inspect report for failures (Windows)"
depends = ["managed:test-runner"]
usage = '''
arg "<ffxiv>" help="Trusted FFXIV plugin copy with its required chart dependency"
arg "<overlay>" help="Trusted OverlayPlugin DLL with its shipped libs directory"
arg "<cactbot>" help="Trusted CactbotOverlay DLL with its shipped event source"
arg "<state>" help="Private writable state directory"
'''
run = '{{vars.managed_tests}} overlay-stack "$usage_ffxiv" "$usage_overlay" "$usage_cactbot" "$usage_state"'
run_windows = '{{vars.managed_tests}} overlay-stack "%usage_ffxiv%" "%usage_overlay%" "%usage_cactbot%" "%usage_state%"'

[tasks."test:plugin-metadata"]
description = "Compare plugin list, version and closing-state data signatures with original ACT (Windows)"
depends = ["managed:references"]
run = 'echo "Plugin metadata reference checks require Windows"'
run_windows = [
  "{{vars.managed_tests}} plugin-metadata",
  'dotnet exec --runtimeconfig crates/aftercast/managed/Aftercast.Bridge.runtimeconfig.windows.json managed/tests/OriginalReference/bin/Release/net10.0/Aftercast.OriginalReference.dll "{{vars.act}}" {{vars.forms}} plugin-metadata {{vars.reference_probe}}',
]

[tasks."test:overlay-integration"]
description = "Verify original OverlayPlugin/cactbot WS handlers and live log delivery into raidboss (Windows, existing Playwright/Edge)"
depends = ["managed:test-runner"]
usage = '''
arg "<ffxiv>" help="Trusted original FFXIV plugin copy"
arg "<overlay>" help="Trusted maintained OverlayPlugin DLL"
arg "<cactbot>" help="Trusted CactbotOverlay DLL"
arg "<state>" help="Private state with original CEF files prepared"
'''
run = '{{vars.managed_tests}} overlay-integration "$usage_ffxiv" "$usage_overlay" "$usage_cactbot" "$usage_state"'
run_windows = '{{vars.managed_tests}} overlay-integration "%usage_ffxiv%" "%usage_overlay%" "%usage_cactbot%" "%usage_state%"'

[tasks."test:browser-audio"]
description = "Verify shipped cactbot HTMLAudio and local Web Speech playback with real Chromium/Edge"
usage = '''
arg "<cactbot>" help="Extracted cactbot root containing ui and resources"
arg "<state>" help="Writable browser audio report directory"
'''
run = 'sh managed/tests/cactbot-audio-linux.sh "$usage_cactbot" "$usage_state"'
run_windows = [
  "node --test managed/tests/cactbot-audio.test.cjs",
  'node managed/tests/cactbot-audio.cjs "%usage_cactbot%" "%usage_state%"',
]

[tasks."test:plugin-updates"]
description = "Query the official ACT plugin version endpoint from replacement and original ACT (Windows, network)"
depends = ["managed:references"]
run = 'echo "Original update endpoint comparison requires Windows"'
run_windows = [
  "{{vars.managed_tests}} plugin-updates",
  'dotnet exec --runtimeconfig crates/aftercast/managed/Aftercast.Bridge.runtimeconfig.windows.json managed/tests/OriginalReference/bin/Release/net10.0/Aftercast.OriginalReference.dll "{{vars.act}}" {{vars.forms}} plugin-updates {{vars.reference_probe}}',
]

[tasks."test:overlay-renderer"]
description = "Check pinned in-memory HtmlRenderer native copy compatibility on Windows x64"
depends = ["managed:test-runner"]
usage = 'arg "<renderer>" help="Original HtmlRenderer.dll from OverlayPlugin 0.19.111"'
run = '{{vars.managed_tests}} overlay-renderer "$usage_renderer"'
run_windows = '{{vars.managed_tests}} overlay-renderer "%usage_renderer%"'

[tasks."test:timer-models"]
description = "Compare ACT timer values and frame contracts (Windows native reference)"
depends = ["managed:references"]
run = "{{vars.managed_tests}} timer-models"
run_windows = [
  "{{vars.managed_tests}} timer-models",
  'dotnet exec --runtimeconfig crates/aftercast/managed/Aftercast.Bridge.runtimeconfig.windows.json managed/tests/OriginalReference/bin/Release/net10.0/Aftercast.OriginalReference.dll "{{vars.act}}" {{vars.forms}} timer-models {{vars.reference_probe}}',
]

[tasks."test:audio"]
description = "Compare PlaySound delegate/volume and timer TTS dispatch with genuine ACT (Windows)"
depends = ["managed:references"]
run = "{{vars.managed_tests}} audio"
run_windows = [
  "{{vars.managed_tests}} audio",
  'dotnet exec --runtimeconfig crates/aftercast/managed/Aftercast.Bridge.runtimeconfig.windows.json managed/tests/OriginalReference/bin/Release/net10.0/Aftercast.OriginalReference.dll "{{vars.act}}" {{vars.forms}} audio {{vars.reference_probe}}',
]

[tasks."test:external-timer"]
description = "Exercise unmodified Timer Repeater expiry, combat restriction and native cancellation"
depends = ["managed:test-runner"]
usage = '''
arg "<plugin>" help="Trusted compiled TimerRepeatPlugin assembly"
arg "<state>" help="Private writable test state directory"
'''
run = '{{vars.managed_tests}} external-timer "$usage_plugin" "$usage_state"'
run_windows = '{{vars.managed_tests}} external-timer "%usage_plugin%" "%usage_state%"'

[tasks."test:eq2-timestamps"]
description = "Compare ACT's default displayed-date log parser (Windows native reference)"
depends = ["managed:references"]
run = "{{vars.managed_tests}} eq2-timestamps"
run_windows = [
  "{{vars.managed_tests}} eq2-timestamps",
  'dotnet exec --runtimeconfig crates/aftercast/managed/Aftercast.Bridge.runtimeconfig.windows.json managed/tests/OriginalReference/bin/Release/net10.0/Aftercast.OriginalReference.dll "{{vars.act}}" {{vars.forms}} eq2-timestamps {{vars.reference_probe}}',
]

[tasks."test:external-eq2"]
description = "Import controlled EQ2 logs with the unmodified English parser and save a replay transcript"
depends = ["managed:test-runner"]
usage = '''
arg "<plugin>" help="Trusted compiled ACT_English_Parser assembly"
arg "<state>" help="Private writable test state directory"
'''
run = '{{vars.managed_tests}} external-eq2 "$usage_plugin" "$usage_state"'
run_windows = '{{vars.managed_tests}} external-eq2 "%usage_plugin%" "%usage_state%"'

[tasks."test:benchmark-ui"]
description = "Compare native benchmark column sizing and timestamped UI logs against original ACT (Windows)"
depends = ["managed:references"]
run = 'echo "Benchmark UI reference checks require Windows"'
run_windows = [
  "{{vars.managed_tests}} benchmark-ui",
  'dotnet exec --runtimeconfig crates/aftercast/managed/Aftercast.Bridge.runtimeconfig.windows.json managed/tests/OriginalReference/bin/Release/net10.0/Aftercast.OriginalReference.dll "{{vars.act}}" {{vars.forms}} benchmark-ui {{vars.reference_probe}}',
]

[tasks."test:external-benchmark"]
description = "Exercise unmodified Benchmark event wrapping, timing and restoration through native controls (Windows)"
depends = ["managed:test-runner"]
usage = '''
arg "<plugin>" help="Trusted EventHandlerBenchmark assembly"
arg "<state>" help="Private writable test state directory"
'''
run = '{{vars.managed_tests}} external-benchmark "$usage_plugin" "$usage_state"'
run_windows = '{{vars.managed_tests}} external-benchmark "%usage_plugin%" "%usage_state%"'

[tasks."test:original-import"]
description = "Import the synthetic fixture through an original plugin copy"
depends = ["managed:test-runner"]
usage = '''
arg "<plugin>" help="Trusted plugin assembly copy"
arg "<state>" help="Private state directory"
'''
run = '{{vars.managed_tests}} original-import "$usage_plugin" "$usage_state"'
# mise defaults to cmd on Windows; quoted environment values preserve paths such as "ACT logs".
run_windows = '{{vars.managed_tests}} original-import "%usage_plugin%" "%usage_state%"'

[tasks."test:original-corpus"]
description = "Import the pinned Zeromus corpus three times"
depends = ["managed:test-runner"]
usage = '''
arg "<plugin>" help="Trusted plugin assembly copy"
arg "<state>" help="Private state directory"
arg "<corpus>" help="Pinned recorded log file"
'''
run = '{{vars.managed_tests}} original-corpus "$usage_plugin" "$usage_state" "$usage_corpus"'
run_windows = '{{vars.managed_tests}} original-corpus "%usage_plugin%" "%usage_state%" "%usage_corpus%"'

[tasks."test:original-log"]
description = "Check a private local log using action-derived totals and replay transcripts"
depends = ["managed:test-runner"]
usage = '''
arg "<plugin>" help="Trusted plugin assembly copy"
arg "<state>" help="Private state directory"
arg "<log>" help="Stable local log file"
'''
run = '{{vars.managed_tests}} original-log "$usage_plugin" "$usage_state" "$usage_log"'
run_windows = '{{vars.managed_tests}} original-log "%usage_plugin%" "%usage_state%" "%usage_log%"'

[tasks."test:original-writer"]
description = "Check the original writer in watchdog-protected processes"
run = "dotnet run --project managed/tests/OriginalWriter/OriginalWriter.csproj -c Release -p:RestoreLockedMode=true --"

[tasks."test:recorded-actions"]
description = "Replay a transcript through replacement and genuine ACT"
depends = ["managed:references"]
usage = 'arg "<transcript>" help="Private JSON emitted by test:original-corpus or test:original-log"'
run = [
  '{{vars.managed_tests}} recorded-actions "$usage_transcript"',
  '{{vars.original_tests}} "{{vars.act}}" {{vars.forms}} recorded-actions {{vars.reference_probe}} "$usage_transcript"',
]
run_windows = [
  '{{vars.managed_tests}} recorded-actions "%usage_transcript%"',
  '{{vars.original_tests}} "{{vars.act}}" {{vars.forms}} recorded-actions {{vars.reference_probe}} "%usage_transcript%"',
]

[tasks."managed:test-runner"]
hide = true
depends = ["managed:build"]
run = "dotnet build managed/tests/ManagedTests/ManagedTests.csproj -c Release -p:RestoreLockedMode=true"

[tasks."managed:references"]
hide = true
depends = ["managed:test-runner"]
run = [
  "{{vars.managed_tests}} prepare-act",
  "dotnet build managed/tests/LegacyReference/LegacyReference.csproj -c Release -p:RestoreLockedMode=true",
  "dotnet build managed/tests/OriginalReference/OriginalReference.csproj -c Release -p:RestoreLockedMode=true",
]

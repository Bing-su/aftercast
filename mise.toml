[tasks."managed:build"]
description = "Build the portable C# bridge and prepare the Cargo payload"
depends = ["winforms:build"]
run = "dotnet publish managed/Bridge/Bridge.csproj -c Release --no-self-contained -o crates/bxivact/managed -p:RestoreLockedMode=true"

[tasks."winforms:build"]
description = "Build the independent WinForms/chart compatibility assemblies and update their crate payload"
run = ["dotnet build crates/bxivact-winforms/managed/Charting/Charting.csproj -c Release -o target/managed/forms -p:RestoreLockedMode=true", "cp target/managed/forms/System.Windows.Forms.dll target/managed/forms/System.Windows.Forms.DataVisualization.dll crates/bxivact-winforms/managed/"]

[tasks."test:winforms"]
description = "Check managed WinForms signatures and explicit UI failures without ACT"
depends = ["winforms:build"]
run = "dotnet run --project crates/bxivact-winforms/managed/tests/ContractTests.csproj -c Release -p:RestoreLockedMode=true"

[tasks."managed:restore"]
description = "Restore and lock maintainer-only managed dependencies"
run = ["dotnet restore managed/Bridge/Bridge.csproj", "dotnet restore crates/bxivact-winforms/managed/Charting/Charting.csproj", "dotnet restore crates/bxivact-winforms/managed/tests/ContractTests.csproj", "dotnet restore managed/tests/PluginFixture/PluginFixture.csproj", "dotnet restore managed/tests/LegacyReference/LegacyReference.csproj", "dotnet restore managed/tests/OriginalReference/OriginalReference.csproj", "dotnet restore managed/tests/ManagedTests/ManagedTests.csproj"]

[tasks.check]
description = "Check formatting, Rust lints, and bridge tests"
run = ["cargo fmt --all --check", "cargo clippy --workspace --all-targets -- -D warnings", "cargo test --workspace"]

[tasks."package:check"]
description = "Verify both offline Cargo packages using the packaged, unpublished WinForms dependency"
run = ["cargo package -p bxivact-winforms --offline", "cargo package -p bxivact --offline --exclude-lockfile --config 'patch.crates-io.bxivact-winforms.path=\"target/package/bxivact-winforms-0.1.0\"'"]

[tasks.smoke]
description = "Start, call, and stop the embedded C# bridge using an installed .NET 10"
run = "cargo run -p bxivact --example smoke --"

[tasks."test:hosting"]
description = "Exercise real CLR lifecycle tests; requires DOTNET_ROOT"
run = "cargo test -p bxivact --lib --test hosting -- --ignored"

[tasks."managed:test"]
description = "Validate the managed ABI header and session ownership"
depends = ["managed:test-runner", "test:winforms"]
run = "dotnet run --project managed/tests/ManagedTests/ManagedTests.csproj -c Release --no-build -- bridge"

[tasks."managed:test-runner"]
description = "Build the dependency-free C# contract runner against the two managed implementations"
depends = ["managed:build"]
run = "dotnet build managed/tests/ManagedTests/ManagedTests.csproj -c Release -p:RestoreLockedMode=true"

[tasks."test:log-load"]
description = "Measure synthetic managed log-buffer load and verify exact subscriber-loss accounting"
depends = ["managed:test-runner"]
run = "dotnet run --project managed/tests/ManagedTests/ManagedTests.csproj -c Release --no-build -- log-load"

[tasks."test:act-binding"]
description = "Verify original ACT reference identity and bind a compiled probe to the replacement"
depends = ["managed:test-runner"]
run = ["dotnet run --project managed/tests/ManagedTests/ManagedTests.csproj -c Release --no-build -- prepare-act", "dotnet build managed/tests/LegacyReference/LegacyReference.csproj -c Release -p:RestoreLockedMode=true", "dotnet run --project managed/tests/ManagedTests/ManagedTests.csproj -c Release --no-build -- act"]

[tasks."test:linux-plugin-compat"]
description = "Verify the pinned in-memory Linux adjustment; requires the supplied original FFXIV artifacts"
depends = ["managed:test-runner"]
run = "dotnet run --project managed/tests/ManagedTests/ManagedTests.csproj -c Release --no-build -- linux"

[tasks."test:original-reference"]
description = "Execute pinned original ACT data constructors and configured value/action fixtures without its main form"
depends = ["winforms:build"]
run = [
  'dotnet run --project managed/tests/OriginalReference/OriginalReference.csproj -c Release -p:RestoreLockedMode=true -- "binaries/act/Advanced Combat Tracker.exe" crates/bxivact-winforms/managed',
  'dotnet run --project managed/tests/OriginalReference/OriginalReference.csproj -c Release --no-build -- "binaries/act/Advanced Combat Tracker.exe" crates/bxivact-winforms/managed values',
  'dotnet run --project managed/tests/OriginalReference/OriginalReference.csproj -c Release --no-build -- "binaries/act/Advanced Combat Tracker.exe" crates/bxivact-winforms/managed actions',
]

[tasks."test:original-import"]
description = "Import the fixed synthetic fixture through a trusted original plugin copy; pass plugin-copy and state-directory arguments"
depends = ["managed:test-runner"]
run = "dotnet run --project managed/tests/ManagedTests/ManagedTests.csproj -c Release --no-build -- original-import"

[tasks."test:original-contracts"]
description = "Run the same compiled value/state probes against replacement and genuine ACT in separate processes"
depends = ["test:act-binding"]
run = 'dotnet run --project managed/tests/OriginalReference/OriginalReference.csproj -c Release -p:RestoreLockedMode=true -- "binaries/act/Advanced Combat Tracker.exe" crates/bxivact-winforms/managed contracts managed/tests/LegacyReference/bin/Release/net10.0/Bxivact.LegacyReference.dll'

[tasks."test:plugins"]
description = "Check trusted plugin construction, initialization and cleanup; requires DOTNET_ROOT"
depends = ["managed:test-runner"]
run = ["dotnet build managed/tests/PluginFixture/PluginFixture.csproj -c Release -p:RestoreLockedMode=true", "dotnet run --project managed/tests/ManagedTests/ManagedTests.csproj -c Release --no-build -- plugins", "cargo test -p bxivact --test plugins --test lifecycle --test import --test logs --test snapshots -- --ignored"]

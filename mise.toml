[vars]
managed_tests = "dotnet run --project managed/tests/ManagedTests/ManagedTests.csproj -c Release --no-build --"
original_tests = "dotnet run --project managed/tests/OriginalReference/OriginalReference.csproj -c Release --no-build --"
act = "binaries/act/Advanced Combat Tracker.exe"
forms = "crates/aftercast-winforms/managed"
reference_probe = "managed/tests/LegacyReference/bin/Release/net10.0/Aftercast.LegacyReference.dll"

[tasks."managed:build"]
description = "Build the bridge and refresh the Cargo payload"
depends = ["winforms:build"]
run = "dotnet publish managed/Bridge/Bridge.csproj -c Release --no-self-contained -o crates/aftercast/managed -p:RestoreLockedMode=true"

[tasks."winforms:build"]
description = "Build the independent WinForms and chart payload"
run = [
  "dotnet build crates/aftercast-winforms/managed/Charting/Charting.csproj -c Release -o target/managed/forms -p:RestoreLockedMode=true",
  "cp target/managed/forms/System.Windows.Forms.dll target/managed/forms/System.Windows.Forms.DataVisualization.dll crates/aftercast-winforms/managed/",
]

[tasks."managed:restore"]
description = "Refresh managed dependency locks"
run = [
  "dotnet restore managed/Bridge/Bridge.csproj",
  "dotnet restore crates/aftercast-winforms/managed/Charting/Charting.csproj",
  "dotnet restore crates/aftercast-winforms/managed/tests/ContractTests.csproj",
  "dotnet restore managed/tests/PluginFixture/PluginFixture.csproj",
  "dotnet restore managed/tests/LegacyReference/LegacyReference.csproj",
  "dotnet restore managed/tests/OriginalReference/OriginalReference.csproj",
  "dotnet restore managed/tests/OriginalWriter/OriginalWriter.csproj",
  "dotnet restore managed/tests/ManagedTests/ManagedTests.csproj",
]

[tasks.check]
description = "Run Rust, managed and CLR fixture checks (DOTNET_ROOT required)"
depends = ["managed:test", "test:winforms", "test:hosting", "test:plugins"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
]

[tasks."package:check"]
description = "Verify both offline Cargo packages"
run = [
  "cargo package -p aftercast-winforms --offline",
  "cargo package -p aftercast --offline --exclude-lockfile --config 'patch.crates-io.aftercast-winforms.path=\"target/package/aftercast-winforms-0.1.0\"'",
]

[tasks.smoke]
description = "Extract the bundled payload, start, probe and stop"
run = "cargo run -p aftercast --example smoke --"

[tasks."managed:test"]
description = "Check the bridge and synthetic ACT contracts"
depends = ["managed:test-runner"]
run = ["{{vars.managed_tests}} bridge", "{{vars.managed_tests}} contracts"]

[tasks."test:winforms"]
description = "Check independent WinForms and chart contracts"
depends = ["winforms:build"]
run = "dotnet run --project crates/aftercast-winforms/managed/tests/ContractTests.csproj -c Release -p:RestoreLockedMode=true"

[tasks."test:hosting"]
description = "Check CLR lifecycle and diagnostics (DOTNET_ROOT required)"
depends = ["managed:build"]
run = "cargo test -p aftercast --lib --test hosting -- --ignored"

[tasks."test:plugins"]
description = "Check plugin lifecycle and owned output (DOTNET_ROOT required)"
depends = ["managed:test-runner"]
run = [
  "dotnet build managed/tests/PluginFixture/PluginFixture.csproj -c Release -p:RestoreLockedMode=true",
  "{{vars.managed_tests}} plugins",
  "cargo test -p aftercast --test plugins --test lifecycle --test import --test logs --test snapshots -- --ignored",
]

[tasks."test:log-load"]
description = "Measure synthetic log-buffer load and loss accounting"
depends = ["managed:test-runner"]
run = "{{vars.managed_tests}} log-load"

[tasks."test:original"]
description = "Compare reference contracts with genuine ACT"
depends = ["managed:references"]
run = [
  "{{vars.managed_tests}} act",
  '{{vars.original_tests}} "{{vars.act}}" {{vars.forms}}',
  '{{vars.original_tests}} "{{vars.act}}" {{vars.forms}} values',
  '{{vars.original_tests}} "{{vars.act}}" {{vars.forms}} actions',
  '{{vars.original_tests}} "{{vars.act}}" {{vars.forms}} contracts {{vars.reference_probe}}',
]

[tasks."test:linux-plugin-compat"]
description = "Check pinned Linux memory, writer and resource corrections"
depends = ["managed:test-runner"]
run = "{{vars.managed_tests}} linux"

[tasks."test:original-import"]
description = "Import the synthetic fixture through an original plugin copy"
depends = ["managed:test-runner"]
usage = '''
arg "<plugin>" help="Trusted plugin assembly copy"
arg "<state>" help="Private state directory"
'''
run = '{{vars.managed_tests}} original-import "$usage_plugin" "$usage_state"'
# mise defaults to cmd on Windows; quoted environment values preserve paths such as "ACT logs".
run_windows = '{{vars.managed_tests}} original-import "%usage_plugin%" "%usage_state%"'

[tasks."test:original-corpus"]
description = "Import the pinned Zeromus corpus three times"
depends = ["managed:test-runner"]
usage = '''
arg "<plugin>" help="Trusted plugin assembly copy"
arg "<state>" help="Private state directory"
arg "<corpus>" help="Pinned recorded log file"
'''
run = '{{vars.managed_tests}} original-corpus "$usage_plugin" "$usage_state" "$usage_corpus"'
run_windows = '{{vars.managed_tests}} original-corpus "%usage_plugin%" "%usage_state%" "%usage_corpus%"'

[tasks."test:original-log"]
description = "Check a private local log using action-derived totals and replay transcripts"
depends = ["managed:test-runner"]
usage = '''
arg "<plugin>" help="Trusted plugin assembly copy"
arg "<state>" help="Private state directory"
arg "<log>" help="Stable local log file"
'''
run = '{{vars.managed_tests}} original-log "$usage_plugin" "$usage_state" "$usage_log"'
run_windows = '{{vars.managed_tests}} original-log "%usage_plugin%" "%usage_state%" "%usage_log%"'

[tasks."test:original-writer"]
description = "Check the original writer in watchdog-protected processes"
run = "dotnet run --project managed/tests/OriginalWriter/OriginalWriter.csproj -c Release -p:RestoreLockedMode=true --"

[tasks."test:recorded-actions"]
description = "Replay a transcript through replacement and genuine ACT"
depends = ["managed:references"]
usage = 'arg "<transcript>" help="Private JSON emitted by test:original-corpus or test:original-log"'
run = [
  '{{vars.managed_tests}} recorded-actions "$usage_transcript"',
  '{{vars.original_tests}} "{{vars.act}}" {{vars.forms}} recorded-actions {{vars.reference_probe}} "$usage_transcript"',
]
run_windows = [
  '{{vars.managed_tests}} recorded-actions "%usage_transcript%"',
  '{{vars.original_tests}} "{{vars.act}}" {{vars.forms}} recorded-actions {{vars.reference_probe}} "%usage_transcript%"',
]

[tasks."managed:test-runner"]
hide = true
depends = ["managed:build"]
run = "dotnet build managed/tests/ManagedTests/ManagedTests.csproj -c Release -p:RestoreLockedMode=true"

[tasks."managed:references"]
hide = true
depends = ["managed:test-runner"]
run = [
  "{{vars.managed_tests}} prepare-act",
  "dotnet build managed/tests/LegacyReference/LegacyReference.csproj -c Release -p:RestoreLockedMode=true",
  "dotnet build managed/tests/OriginalReference/OriginalReference.csproj -c Release -p:RestoreLockedMode=true",
]

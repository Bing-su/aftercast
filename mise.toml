[tasks."managed:build"]
description = "Build the portable F# bridge and prepare the Cargo payload"
run = ["dotnet publish managed/Bridge/Bridge.fsproj -c Release --no-self-contained -o crates/bxivact/managed -p:RestoreLockedMode=true", "dotnet build managed/FormsContract/FormsContract.fsproj -c Release -o target/managed/forms -p:RestoreLockedMode=true", "cp target/managed/forms/System.Windows.Forms.dll crates/bxivact/managed/System.Windows.Forms.dll"]

[tasks."managed:restore"]
description = "Restore and lock maintainer-only F# dependencies"
run = ["dotnet restore managed/Bridge/Bridge.fsproj", "dotnet restore managed/FormsContract/FormsContract.fsproj", "dotnet restore managed/tests/PluginFixture/PluginFixture.fsproj"]

[tasks.check]
description = "Check formatting, Rust lints, and bridge tests"
run = ["cargo fmt --all --check", "cargo clippy --workspace --all-targets -- -D warnings", "cargo test --workspace"]

[tasks.smoke]
description = "Start, call, and stop the embedded F# bridge using an installed .NET 10"
run = "cargo run -p bxivact --example smoke --"

[tasks."test:hosting"]
description = "Exercise real CLR lifecycle tests; requires DOTNET_ROOT"
run = "cargo test -p bxivact --lib --test hosting -- --ignored"

[tasks."managed:test"]
description = "Validate the managed ABI header and session ownership"
depends = ["managed:build"]
run = "dotnet fsi --exec managed/tests/BridgeTests.fsx"

[tasks."test:act-binding"]
description = "Verify original ACT reference identity and bind a compiled probe to the replacement"
run = ["dotnet fsi --exec managed/tests/PrepareActReference.fsx", "dotnet build managed/tests/LegacyReference/LegacyReference.fsproj -c Release -p:RestoreLockedMode=true", "mise run managed:build", "dotnet fsi --exec managed/tests/ActBindingTests.fsx"]

[tasks."test:plugins"]
description = "Construct trusted F# fixtures through the bundled bridge; requires DOTNET_ROOT"
depends = ["managed:build"]
run = ["dotnet build managed/tests/PluginFixture/PluginFixture.fsproj -c Release -p:RestoreLockedMode=true", "dotnet fsi --exec managed/tests/PluginRequests.fsx", "cargo test -p bxivact --test plugins -- --ignored"]
